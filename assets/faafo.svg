<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d">
  <title id="t">A whiteboard graph of fucking around against finding out</title>
  <desc id="d">Marker-drawn chart on a whiteboard. The vertical axis is labelled FIND OUT, the horizontal axis FUCK AROUND. A single green line runs from the origin to the top right corner. A box marks where both axes hit 7, circled, while a man in glasses and a checked shirt holds a green marker.</desc>

