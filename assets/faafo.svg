      <stop offset="0.55" stop-color="#f4f3ec" />
      <stop offset="1" stop-color="#e9e7dd" />
    </linearGradient>
    <radialGradient id="glare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdad1" />
      <stop offset="1" stop-color="#bfbdb2" />
    </linearGradient>
    <clipPath id="surface"><rect x="6" y="6" width="628" height="418" rx="6" /></clipPath>
  </defs>

